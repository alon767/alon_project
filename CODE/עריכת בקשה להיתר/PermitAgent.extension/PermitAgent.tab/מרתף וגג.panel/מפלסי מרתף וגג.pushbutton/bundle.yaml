title: "מפלסי\nמרתף וגג"
tooltip: 'בתכנית מרתף: ערך מוחלט (בלי סימבול) בכל קו שבירת שיפוע ברמפה, שיפוע X% עם חץ, וערך באזור השטוח של הנתיב. בתכנית גג: ראש המעקה הבנוי בפינות עם הכיתוב "מעקה בנוי", ופני הגג. להריץ אחרי "עדכון מפלסים". רץ רק על עותק עבודה (_AGENT). Ctrl+Z אחד מבטל הכול.'
author: "PermitAgent"
