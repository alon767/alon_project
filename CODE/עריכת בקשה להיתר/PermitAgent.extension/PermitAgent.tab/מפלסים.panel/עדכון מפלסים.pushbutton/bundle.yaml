title: "עדכון\nמפלסים"
tooltip: 'בקומת מגורים: סימון מפלס בלובי הקומתי מול המעליות ("לובי קומתי" מעליו), סימון מפלס בכל מרפסת ("מרפסת" מעליו), ובקומה טיפוסית בלוק "מפלסים:" ליד כותרת הקומה. צריך להריץ קודם "עדכון חדרים ושמות". רץ רק על עותק עבודה (_AGENT). Ctrl+Z אחד מבטל הכול.'
author: "PermitAgent"
